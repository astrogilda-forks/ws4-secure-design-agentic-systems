name: RFC-189 conformance

on:
  pull_request:
    paths:
      - "conformance/RFC-189/**"
      - ".github/workflows/conformance-rfc-189.yml"
  push:
    branches: [main]
    paths:
      - "conformance/RFC-189/**"
      - ".github/workflows/conformance-rfc-189.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observed-effect:
    name: Observed Effect cases
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conformance/RFC-189/observed-effect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Check the pinned corpus against its own manifest
        run: agent-evidence-vectors --corpus vectors-observed-effect
      - run: python run.py
      - run: python -m unittest test_checker
